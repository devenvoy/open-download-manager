name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.0-beta.1)'
        required: true
        default: 'v0.3.0-beta.1'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri macOS Release (${{ matrix.arch }})
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles dmg,app

      - name: Package macOS Assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.3.0-beta.1"
          fi
          VERSION="${VERSION#v}"

          mkdir -p dist/artifacts
          shopt -s nullglob

          dmg_files=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg target/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -gt 0 ]; then
            cp "${dmg_files[0]}" "dist/artifacts/open-download-manager_${VERSION}_mac_${{ matrix.arch }}.dmg"
            echo "Packaged DMG: ${dmg_files[0]}"
          fi

          app_dirs=(target/${{ matrix.target }}/release/bundle/macos/*.app src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app target/release/bundle/macos/*.app)
          if [ ${#app_dirs[@]} -gt 0 ]; then
            app_path="${app_dirs[0]}"
            app_name=$(basename "$app_path")
            parent_dir=$(dirname "$app_path")
            tar -czf "dist/artifacts/open-download-manager_${VERSION}_mac_${{ matrix.arch }}.app.tar.gz" -C "$parent_dir" "$app_name"
            echo "Packaged App tar: $app_path"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-assets
          path: dist/artifacts/*

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Windows Release (${{ matrix.arch }})
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Package Windows Assets
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver) { $ver = "${{ github.event.inputs.tag }}".TrimStart("v") }
          if (-not $ver) { $ver = "0.3.0-beta.1" }

          New-Item -ItemType Directory -Force -Path "dist/artifacts"
          $exe = Get-ChildItem -Path @("target/${{ matrix.target }}/release/bundle/nsis", "src-tauri/target/${{ matrix.target }}/release/bundle/nsis", "target/release/bundle/nsis") -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist/artifacts/open-download-manager_${ver}_win_${{ matrix.arch }}-setup.exe" -Force
            Write-Host "Successfully packaged: dist/artifacts/open-download-manager_${ver}_win_${{ matrix.arch }}-setup.exe"
          } else {
            Write-Error "No setup executable found!"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-assets
          path: dist/artifacts/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Tauri Linux Release (deb & appimage)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun tauri build --bundles deb,appimage

      - name: Package Linux Assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.3.0-beta.1"
          fi
          VERSION="${VERSION#v}"

          mkdir -p dist/artifacts
          shopt -s nullglob

          deb_files=(target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#deb_files[@]} -gt 0 ]; then
            cp "${deb_files[0]}" "dist/artifacts/open-download-manager_${VERSION}_lin_x64.deb"
            echo "Packaged DEB: ${deb_files[0]}"
          fi

          appimage_files=(target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#appimage_files[@]} -gt 0 ]; then
            cp "${appimage_files[0]}" "dist/artifacts/open-download-manager_${VERSION}_lin_x64.AppImage"
            echo "Packaged AppImage: ${appimage_files[0]}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-assets
          path: dist/artifacts/*

  package-and-publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build Browser Extensions
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run pack:extension

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/collected_artifacts

      - name: Assemble Release Assets & Generate Checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.3.0-beta.1"
          fi
          VERSION="${VERSION#v}"

          mkdir -p dist/final_release
          
          # Move browser extensions
          cp dist/extension/open-download-manager_${VERSION}_ext_chrome.zip dist/final_release/ 2>/dev/null || true
          cp dist/extension/open-download-manager_${VERSION}_ext_firefox.xpi dist/final_release/ 2>/dev/null || true
          cp dist/extension/open-download-manager_${VERSION}_ext_firefox.zip dist/final_release/ 2>/dev/null || true

          # Move compiled platform installers
          find dist/collected_artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/final_release/ \;

          # Generate SHA-256 Checksums
          cd dist/final_release
          sha256sum * > "open-download-manager_${VERSION}_checksums.txt"
          ls -la

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: dist/final_release/*
          draft: false
          # A tag with a pre-release suffix (beta, rc) marks the release as a
          # pre-release so users on the stable channel are not pushed to it.
          prerelease: ${{ contains(github.ref_name || github.event.inputs.tag, '-') }}
