name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri macOS Release (${{ matrix.arch }})
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles dmg,app

      - name: Package macOS Assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] && VERSION="${{ github.event.inputs.tag }}"
          [ "$VERSION" = "" ] && VERSION="0.2.0"
          VERSION="${VERSION#v}"

          mkdir -p dist/artifacts
          
          # Find DMG
          DMG_FILE=$(find target/${{ matrix.target }}/release/bundle/dmg src-tauri/target/${{ matrix.target }}/release/bundle/dmg target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            cp "$DMG_FILE" "dist/artifacts/open-download-manager_${VERSION}_mac_${{ matrix.arch }}.dmg"
          fi

          # Find .app and tar.gz
          APP_DIR=$(find target/${{ matrix.target }}/release/bundle/macos src-tauri/target/${{ matrix.target }}/release/bundle/macos target/release/bundle/macos -name "*.app" 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            APP_NAME=$(basename "$APP_DIR")
            PARENT_DIR=$(dirname "$APP_DIR")
            tar -czf "dist/artifacts/open-download-manager_${VERSION}_mac_${{ matrix.arch }}.app.tar.gz" -C "$PARENT_DIR" "$APP_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-assets
          path: dist/artifacts/*

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Windows Release (${{ matrix.arch }})
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Package Windows Assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] && VERSION="${{ github.event.inputs.tag }}"
          [ "$VERSION" = "" ] && VERSION="0.2.0"
          VERSION="${VERSION#v}"

          mkdir -p dist/artifacts
          EXE_FILE=$(find target/${{ matrix.target }}/release/bundle/nsis src-tauri/target/${{ matrix.target }}/release/bundle/nsis -name "*.exe" 2>/dev/null | head -n 1)
          if [ -n "$EXE_FILE" ] && [ -f "$EXE_FILE" ]; then
            cp "$EXE_FILE" "dist/artifacts/open-download-manager_${VERSION}_win_${{ matrix.arch }}-setup.exe"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-assets
          path: dist/artifacts/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Tauri Linux Release (deb & appimage)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun tauri build --bundles deb,appimage

      - name: Package Linux Assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] && VERSION="${{ github.event.inputs.tag }}"
          [ "$VERSION" = "" ] && VERSION="0.2.0"
          VERSION="${VERSION#v}"

          mkdir -p dist/artifacts
          DEB_FILE=$(find target/release/bundle/deb src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "dist/artifacts/open-download-manager_${VERSION}_lin_x64.deb"
          fi

          APPIMAGE_FILE=$(find target/release/bundle/appimage src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "dist/artifacts/open-download-manager_${VERSION}_lin_x64.AppImage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-assets
          path: dist/artifacts/*

  package-and-publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build Browser Extensions
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run pack:extension

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/collected_artifacts

      - name: Assemble Release Assets & Generate Checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] && VERSION="${{ github.event.inputs.tag }}"
          [ "$VERSION" = "" ] && VERSION="0.2.0"
          VERSION="${VERSION#v}"

          mkdir -p dist/final_release
          
          # Move browser extensions
          cp dist/extension/open-download-manager_${VERSION}_ext_chrome.zip dist/final_release/ 2>/dev/null || true
          cp dist/extension/open-download-manager_${VERSION}_ext_firefox.xpi dist/final_release/ 2>/dev/null || true
          cp dist/extension/open-download-manager_${VERSION}_ext_firefox.zip dist/final_release/ 2>/dev/null || true

          # Move compiled platform installers
          find dist/collected_artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/final_release/ \;

          # Generate SHA-256 Checksums
          cd dist/final_release
          sha256sum * > "open-download-manager_${VERSION}_checksums.txt"
          ls -la

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: dist/final_release/*
          draft: false
          prerelease: false
