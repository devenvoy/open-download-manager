name: Windows Engine & Build Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    name: Windows CI Check (NTFS Sparse & Win32)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cargo check all targets
        run: cargo check --all-targets

      - name: Run engine and fault injection tests
        run: cargo test --test fault_injection --test download_transfer --test sparse_robustness

      - name: Build frontend assets
        run: bun run frontend:build

      - name: Build standalone app binary with embedded assets
        run: bun tauri build --no-bundle
