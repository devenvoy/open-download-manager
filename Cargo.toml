[workspace]
members = [
    "src-tauri"
]
default-members = ["src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
# Full link-time optimisation: smaller and faster binaries than "thin", and it
# removes cross-crate call overhead that would otherwise expose internals.
lto = "fat"
codegen-units = 1
panic = "abort"
# Strip symbols and debug paths so the shipped binary carries no debug info.
strip = true
