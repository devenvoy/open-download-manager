<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost; connect-src 'self' ipc: http://ipc.localhost ws://localhost:5173 http://localhost:5173; base-uri 'none'; form-action 'none'"
    />
    <title>Open Download Manager</title>
    <script>
      (function() {
        try {
          var initial = window.__INITIAL_THEME__;
          var stored = initial || localStorage.getItem("odm-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "dark" || (stored !== "light" && prefersDark) ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #1e1e1e !important;
        color: #e0e0e0 !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f0f0f0 !important;
        color: #111111 !important;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body {
          background-color: #1e1e1e !important;
          color: #e0e0e0 !important;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]), html:not([data-theme="dark"]) body {
          background-color: #f0f0f0 !important;
          color: #111111 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
