[package]
name = "open-download-manager"
version = "0.3.0-beta.1"
description = "Open Download Manager desktop application"
authors = ["Open Download Manager contributors"]
license = "MIT"
edition = "2021"
default-run = "open-download-manager"

[lib]
name = "open_download_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-download-manager"
path = "src/main.rs"

[[bin]]
name = "open-download-manager-native-host"
path = "src/bin/native_host.rs"

[[bin]]
name = "perf_benchmark"
path = "src/bin/perf_benchmark.rs"
# Development-only tool. The Tauri CLI skips binaries whose required features
# are disabled, so the benchmark never ends up in a shipped installer.
required-features = ["bench"]

[features]
bench = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1.11"
image = { version = "0.25", default-features = false, features = ["png"] }
# BitTorrent engine (rustTorrent / rqbit fork). Pinned to an exact revision of
# the upstream repository so builds are reproducible. The same commit is tracked
# locally as the git submodule at `vendor/rustTorrent` (auditable source).
#
# The engine is compiled from the git dependency, not from the submodule
# folder: a change in `vendor/rustTorrent` has no effect on the build until it
# is pushed upstream and the revision below is moved to it.
#
# rust-tls keeps the app on rustls instead of pulling native-tls/OpenSSL.
librtbit = { package = "swarmforge", git = "https://github.com/TheDancingDeveloper-org/rustTorrent.git", rev = "94aae0460fe031af59a532586ccefc10f9a637bd", default-features = false, features = ["rust-tls"] }
libc = "0.2"
mime_guess = "2.0"
opener = { version = "0.9.0", features = ["reveal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
sanitize-filename = "0.6"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.46"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.5.5"
tempfile = "3.17"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
which = "7.0"
xz2 = "0.1.7"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

# macOS needs the AppKit bindings to ask LaunchServices to make ODM the
# default handler for magnet links and .torrent files. Other torrent clients
# register `magnet:` as `LSHandlerRank = Owner`, so a bundle declaration
# alone is not enough to win the routing.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSURL", "NSString", "NSError"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
