[package]
name = "awesome-downloader"
version = "0.1.2"
description = "Awesome Downloader desktop application"
authors = ["Awesome Downloader contributors"]
edition = "2021"

[lib]
name = "awesome_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "awesome-downloader"
path = "src/main.rs"

[[bin]]
name = "awesome-downloader-native-host"
path = "src/bin/native_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
opener = { version = "0.9.0", features = ["reveal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
